<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Inventory — LUXE VAULT Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">

    <div class="admin-layout" id="admin-clothes-view">
        <!-- SIDEBAR -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <a href="../index.html" class="brand-logo" style="color:white; font-size:1.2rem;">
                    <div class="logo-icon">💎</div>
                    <span>LUXE <span class="accent">VAULT</span></span>
                </a>
            </div>

            <nav class="admin-menu">
                <a href="admin-dashboard.html" class="admin-menu-item">
                    <span>📊 Dashboard</span>
                </a>
                <a href="admin-clothes.html" class="admin-menu-item active">
                    <span>👗 Clothes Inventory</span>
                </a>
                <a href="admin-customers.html" class="admin-menu-item">
                    <span>👥 Customers</span>
                </a>
                <a href="admin-rentals.html" class="admin-menu-item">
                    <span>📦 Rentals & Orders</span>
                </a>
                <a href="admin-payments.html" class="admin-menu-item">
                    <span>💳 Payments Ledger</span>
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <a href="../index.html" class="btn btn-outline btn-sm btn-full" style="color:#ebdcd5; border-color:rgba(255,255,255,0.2);">Exit to Storefront</a>
            </div>
        </aside>

        <!-- MAIN -->
        <div class="admin-main">
            <header class="admin-header">
                <h1 class="admin-page-title">Clothing Inventory Management</h1>
                <button id="btn-open-add-modal" class="btn btn-accent btn-sm">+ Add New Outfit</button>
            </header>

            <main class="admin-content">
                <div class="table-card">
                    <div class="table-header-bar">
                        <h3 style="font-size:1.1rem; font-weight:800;">Luxe Vault Inventory</h3>
                    </div>
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Outfit Item</th>
                                    <th>Category</th>
                                    <th>Size</th>
                                    <th>Rental Price</th>
                                    <th>Deposit</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="clothes-table-tbody">
                                <!-- Populated dynamically by admin.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ADD CLOTHING MODAL -->
    <div id="add-clothing-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Add New Outfit to Vault</h3>
                <button id="modal-close-btn" class="modal-close">&times;</button>
            </div>
            <form id="add-clothing-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Outfit Name</label>
                        <input type="text" id="new-name" class="form-control" placeholder="e.g. Royal Silk Sherwani" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <select id="new-category" class="form-control" required>
                                <option value="Dresses">Dresses</option>
                                <option value="Suits">Suits & Tuxedos</option>
                                <option value="Lehengas">Lehengas</option>
                                <option value="Sherwanis">Sherwanis</option>
                                <option value="Gowns">Evening Gowns</option>
                                <option value="Formal Wear">Formal Wear</option>
                                <option value="Party Wear">Party Wear</option>
                                <option value="Traditional Wear">Traditional Wear</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Size</label>
                            <select id="new-size" class="form-control" required>
                                <option value="XS">XS</option>
                                <option value="S">S</option>
                                <option value="M" selected>M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="XXL">XXL</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Gender Section</label>
                            <select id="new-gender" class="form-control" required>
                                <option value="Women">Women</option>
                                <option value="Men">Men</option>
                                <option value="Unisex">Unisex</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Color</label>
                            <input type="text" id="new-color" class="form-control" placeholder="e.g. Crimson Red" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Rental Price / Day (₹)</label>
                            <input type="number" id="new-price" class="form-control" placeholder="899" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Security Deposit (₹)</label>
                            <input type="number" id="new-deposit" class="form-control" placeholder="1200" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Image URL</label>
                        <input type="url" id="new-image" class="form-control" placeholder="https://images.unsplash.com/..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="new-description" class="form-control" rows="3" placeholder="Provide details on fabric, cut, and occasion..." required></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-accent">Save to Inventory</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../js/mock-data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
